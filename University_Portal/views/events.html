<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Portal | CUSIT Smart Campus Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="toast-container"></div>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo"><i class="fas fa-graduation-cap" style="font-size: 2rem;"></i><span>CUSIT<br><small style="font-size: 0.65rem; opacity: 0.7; font-weight: 500;">Academic Portal</small></span></div>
            <nav class="sidebar-nav">
                <a href="/" class="sidebar-link" id="dashboardLink"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
                <a href="/complaints" class="sidebar-link"><i class="fas fa-comments"></i> <span>Complaints</span></a>
                <a href="/events" class="sidebar-link active"><i class="fas fa-calendar-alt"></i> <span>Events</span></a>
                <a href="/fyp" class="sidebar-link"><i class="fas fa-project-diagram"></i> <span>FYP Management</span></a>
                <a href="/announcements" class="sidebar-link"><i class="fas fa-bullhorn"></i> <span>Announcements</span></a>
            </nav>
            <div class="sidebar-footer">
                <button id="sidebarSubmissionBtn" class="btn btn-primary mt-2 mb-4" style="width: 100%; gap: 0.75rem; padding: 0.875rem;" onclick="location.href='/complaints'">
                    <i class="fas fa-plus"></i> New Submission
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h1 style="font-size: 1.5rem;">Campus Events</h1>
                <div class="flex-row">
                    <button class="btn btn-ghost" style="width: 44px; height: 44px; padding: 0; border-radius: 50%;" onclick="showToast('No new notifications', 'info')"><i class="far fa-bell"></i></button>
                    <button class="btn btn-ghost" id="themeToggle" style="width: 44px; height: 44px; padding: 0; border-radius: 50%;" onclick="toggleTheme()"><i class="far fa-moon"></i></button>
                    <button class="btn btn-ghost" style="width: 44px; height: 44px; padding: 0; border-radius: 50%;" onclick="showToast('Settings panel coming soon', 'info')"><i class="fas fa-cog"></i></button>
                    <div style="width: 44px; height: 44px; border-radius: 50%; overflow: hidden; border: 2px solid var(--border-subtle);"><img src="" id="userAvatar" style="width: 100%; height: 100%; object-fit: cover;"></div>
                </div>
            </header>

            <div id="loader" class="flex-row" style="justify-content: center; padding: 5rem;"><i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary-main);"></i></div>

            <!-- Student View Content -->
            <div id="studentView" style="display: none;">
                <div style="margin-bottom: 2.5rem;">
                    <h2 style="font-size: 2.25rem; margin-bottom: 0.5rem;">Upcoming Events</h2>
                    <p style="color: var(--text-muted);">Explore and register for upcoming workshops, seminars, and guest lectures.</p>
                </div>
                <div id="studentEventsGrid" class="grid-3"></div>
            </div>

            <!-- Admin View Content -->
            <div id="adminView" style="display: none;">
                <div style="margin-bottom: 2.5rem;">
                    <h2 style="font-size: 2.25rem; margin-bottom: 0.5rem;">Event Management</h2>
                    <p style="color: var(--text-muted);">Create new events and track registrations.</p>
                </div>

                <!-- Create Event Card -->
                <div class="card" style="max-width: 800px; margin-bottom: 3rem;">
                    <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem;"><i class="fas fa-calendar-plus" style="color: var(--primary-main); margin-right: 0.5rem;"></i> Create New Event</h3>
                    <form id="createEventForm">
                        <div class="grid-2">
                            <div class="form-group"><label class="form-label">Event Title</label><input type="text" id="evTitle" class="form-control" placeholder="e.g. AI Ethics Seminar" required></div>
                            <div class="form-group"><label class="form-label">Category</label><select id="evCategory" class="form-control" required><option value="Workshop">Workshop</option><option value="Seminar">Seminar</option><option value="Guest Lecture">Guest Lecture</option><option value="Career Fair">Career Fair</option><option value="Other">Other</option></select></div>
                        </div>
                        <div class="grid-3">
                            <div class="form-group"><label class="form-label">Date</label><input type="date" id="evDate" class="form-control" required></div>
                            <div class="form-group"><label class="form-label">Venue</label><input type="text" id="evVenue" class="form-control" placeholder="Hall A" required></div>
                            <div class="form-group"><label class="form-label">Total Seats</label><input type="number" id="evSeats" class="form-control" min="1" required></div>
                        </div>
                        <div class="form-group"><label class="form-label">Description</label><textarea id="evDesc" class="form-control" style="min-height: 80px;" placeholder="What's this event about?" required></textarea></div>
                        <button type="submit" class="btn btn-primary">Publish Event</button>
                    </form>
                </div>

                <div class="card">
                    <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Active Events</h3>
                    <div id="adminEventsList" style="display: flex; flex-direction: column; gap: 1.5rem;"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) window.location.reload();
        });

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            const icon = type === 'info' ? 'fa-info-circle' : type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        let allEvents = [];
        let me = null;
        const categoryIcons = { 'Workshop': 'fas fa-tools', 'Seminar': 'fas fa-microphone-alt', 'Guest Lecture': 'fas fa-user-tie', 'Career Fair': 'fas fa-briefcase', 'Other': 'fas fa-calendar-day' };
        const categoryColors = { 'Workshop': '#3B82F6', 'Seminar': '#8B5CF6', 'Guest Lecture': '#F59E0B', 'Career Fair': '#10B981', 'Other': '#64748B' };

        function toggleTheme() {
            const html = document.documentElement; const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark'); localStorage.setItem('campusTheme', isDark ? 'light' : 'dark');
            document.querySelector('#themeToggle i').className = isDark ? 'far fa-moon' : 'far fa-sun';
        }
        if (localStorage.getItem('campusTheme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); document.querySelector('#themeToggle i').className = 'far fa-sun'; }

        async function fetchPageData() {
            try {
                const meRes = await fetch('/api/me'); me = await meRes.json();
                document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(me.name)}&background=002D5B&color=fff`;
                document.getElementById('dashboardLink').href = me.role === 'admin' ? '/admin-dashboard' : '/student-dashboard';
                const evRes = await fetch('/api/events'); allEvents = await evRes.json();
                if (me.role === 'admin') {
                    renderAdminView();
                    document.getElementById('sidebarSubmissionBtn').style.display = 'none';
                } else {
                    renderStudentView();
                }
                document.getElementById('loader').style.display = 'none';
            } catch (e) {}
        }

        function renderStudentView() {
            document.getElementById('studentView').style.display = 'block';
            const grid = document.getElementById('studentEventsGrid');
            grid.innerHTML = allEvents.map(e => {
                const color = categoryColors[e.category] || categoryColors.Other;
                const icon = categoryIcons[e.category] || categoryIcons.Other;
                const pct = (e.registered_seats / e.total_seats) * 100;
                let action = '';
                if (e.isRegistered) action = '<span class="badge badge-success"><i class="fas fa-check"></i> Registered</span>';
                else if (e.seatsAvailable <= 0) action = '<span class="badge badge-danger">Registration Full</span>';
                else action = `<button class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.8125rem;" onclick="registerForEvent(${e.id})">Register Now</button>`;

                return `<div class="card" style="padding: 0; overflow: hidden; display: flex; flex-direction: column;">
                    <div style="height: 6px; background: ${color};"></div>
                    <div style="padding: 1.5rem; flex: 1; display: flex; flex-direction: column;">
                        <div class="flex-row" style="justify-content: space-between; margin-bottom: 1rem;">
                            <span class="badge" style="background: ${color}15; color: ${color}; text-transform: none; padding: 0.375rem 0.75rem;"><i class="${icon}"></i> ${e.category}</span>
                            <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">${new Date(e.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                        </div>
                        <h4 style="font-size: 1.125rem; margin-bottom: 0.5rem;">${e.title}</h4>
                        <p style="font-size: 0.8125rem; color: var(--text-muted); margin-bottom: 1rem;"><i class="fas fa-map-marker-alt"></i> ${e.venue}</p>
                        <p style="font-size: 0.875rem; color: var(--text-body); line-height: 1.5; margin-bottom: 1.5rem; flex: 1;">${e.description}</p>
                        <div style="border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
                            <div style="display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 700; margin-bottom: 0.5rem;">
                                <span>Availability</span>
                                <span style="color: ${pct > 90 ? 'var(--accent-danger)' : 'var(--text-muted)'};">${e.seatsAvailable} / ${e.total_seats} seats left</span>
                            </div>
                            <div style="width: 100%; height: 6px; background: var(--bg-app); border-radius: 3px; overflow: hidden; margin-bottom: 1.25rem;">
                                <div style="width: ${pct}%; height: 100%; background: ${color}; border-radius: 3px;"></div>
                            </div>
                            <div class="flex-row" style="justify-content: flex-end;">${action}</div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderAdminView() {
            document.getElementById('adminView').style.display = 'block';
            const list = document.getElementById('adminEventsList');
            list.innerHTML = allEvents.map(e => {
                const color = categoryColors[e.category] || categoryColors.Other;
                const pct = (e.registered_seats / e.total_seats) * 100;
                return `<div class="card" style="padding: 1.25rem; border-left: 4px solid ${color};">
                    <div class="flex-row" style="justify-content: space-between; align-items: flex-start;">
                        <div style="flex: 1;">
                            <h4 style="font-size: 1.125rem; margin-bottom: 0.25rem;">${e.title}</h4>
                            <p style="font-size: 0.8125rem; color: var(--text-muted);"><i class="far fa-calendar"></i> ${e.date} &nbsp;•&nbsp; <i class="fas fa-map-marker-alt"></i> ${e.venue} &nbsp;•&nbsp; <i class="fas fa-tag"></i> ${e.category}</p>
                            <div style="margin-top: 1rem; max-width: 400px;">
                                <div style="display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 0.375rem;">
                                    <span>Registration: <strong>${e.registered_seats} / ${e.total_seats}</strong></span>
                                    <span>${Math.round(pct)}% Full</span>
                                </div>
                                <div style="width: 100%; height: 6px; background: var(--bg-app); border-radius: 3px; overflow: hidden;">
                                    <div style="width: ${pct}%; height: 100%; background: ${color};"></div>
                                </div>
                            </div>
                        </div>
                        <div class="flex-row">
                            <button class="btn btn-ghost" style="padding: 0.5rem 1rem; font-size: 0.75rem;" onclick="toggleRegistrations(${e.id})">View Attendees</button>
                            <button class="btn btn-ghost" style="padding: 0.5rem; color: var(--accent-danger); border-color: rgba(239,68,68,0.2);" onclick="deleteEvent(${e.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div id="regs_${e.id}" style="display:none; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px dashed var(--border-subtle);">
                        <div id="regs_content_${e.id}" style="font-size: 0.875rem;"></div>
                    </div>
                </div>`;
            }).join('');
        }

        async function registerForEvent(id) {
            const res = await fetch(`/api/events/${id}/register`, { method: 'POST' });
            if (res.ok) location.reload();
        }

        document.getElementById('createEventForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = { title: document.getElementById('evTitle').value, category: document.getElementById('evCategory').value, date: document.getElementById('evDate').value, venue: document.getElementById('evVenue').value, total_seats: document.getElementById('evSeats').value, description: document.getElementById('evDesc').value };
            const res = await fetch('/api/events', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            if (res.ok) location.reload();
        });

        async function toggleRegistrations(id) {
            const box = document.getElementById(`regs_${id}`); const content = document.getElementById(`regs_content_${id}`);
            if (box.style.display === 'block') { box.style.display = 'none'; return; }
            box.style.display = 'block'; content.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            const res = await fetch(`/api/events/${id}/registrations`); const data = await res.json();
            if (data.length === 0) content.innerHTML = '<span style="color: var(--text-muted);">No attendees yet.</span>';
            else content.innerHTML = `<table style="width: 100%; text-align: left;"><thead><tr><th>Name</th><th>Email</th></tr></thead><tbody>${data.map(r => `<tr><td>${r.name}</td><td>${r.email}</td></tr>`).join('')}</tbody></table>`;
        }

        async function deleteEvent(id) { if (confirm('Delete this event?')) { await fetch(`/api/events/${id}`, { method: 'DELETE' }); location.reload(); } }

        document.addEventListener('DOMContentLoaded', fetchPageData);
    </script>
</body>
</html>
